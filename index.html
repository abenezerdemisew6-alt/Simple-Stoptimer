<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simple Stopwatch</h1>
    <div class="container">
        <span id="reverse"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></span>
        <div class="circle">
        <div class="time">
          <div id="minute"><span>00</span></div>
          <div id="split"><span>:</span></div>
          <div id="second"><span>00</span></div>
        </div>
        </div>
        <div class="btn-container">
            <button class="startBtn" onclick="counter()">START</button>
            <button class="pause" onclick="pause()">END</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
